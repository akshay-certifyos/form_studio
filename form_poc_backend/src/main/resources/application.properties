# =============================================================================
#  Form Config POC — backend
#  Throwaway service. No deploy, no secrets, no profiles beyond dev and test.
# =============================================================================

quarkus.application.name=form-poc-backend
quarkus.http.port=9100

# Frontend runs on 3200 (apps/form-studio).
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3200,http://localhost:3000

# =============================================================================
#  MongoDB
# -----------------------------------------------------------------------------
#  Dev points at a local mongod (brew install mongodb-community; brew services
#  start mongodb-community). Override with MONGO_URI to use any other instance.
#
#  Dev Services — which would start a Mongo container and need nothing installed
#  — is deliberately OFF, and the reason is worth recording because it will bite
#  the next person:
#
#    Docker Engine 29 sets MinAPIVersion 1.40. The testcontainers version on
#    Quarkus 3.23's classpath (1.21.0) probes the daemon at API v1.32, so /info
#    answers HTTP 400 with an empty engine payload and testcontainers concludes
#    "Could not find a valid Docker environment" — even though the socket is
#    reachable and the docker CLI works fine. Setting DOCKER_API_VERSION does
#    not help; docker-java does not consult it for the probe.
#
#  So it looks like a broken Docker install and is not one. To try Dev Services
#  again after a testcontainers bump, unset the connection string below and set
#  quarkus.mongodb.devservices.enabled=true.
# =============================================================================
quarkus.mongodb.database=form_poc
%dev.quarkus.mongodb.devservices.enabled=false
%dev.quarkus.mongodb.connection-string=${MONGO_URI:mongodb://localhost:27017}

# =============================================================================
#  OpenAPI / Swagger UI — how the API gets exercised before the frontend lands
# =============================================================================
quarkus.smallrye-openapi.info-title=Form Config POC API
quarkus.smallrye-openapi.info-version=0.1.0-POC
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# =============================================================================
#  Application
# =============================================================================
# Seed the catalog, section definitions and one form from form_poc_shared/fixtures
# on startup, so a fresh clone has something to look at.
form-poc.seed.enabled=${SEED_ENABLED:true}
form-poc.seed.fixtures-dir=${SEED_FIXTURES_DIR:../form_poc_shared/fixtures}

# =============================================================================
#  Logging
# =============================================================================
quarkus.log.level=INFO
quarkus.log.category."com.certifyos.forms".level=DEBUG

# =============================================================================
#  Test — no Mongo and no Docker required
# -----------------------------------------------------------------------------
#  Dev Services is off and a connection string is supplied so the client can be
#  constructed. The Mongo driver connects lazily, so the container starts and CDI
#  wiring is validated without a server being reachable. Domain tests use
#  in-memory fakes and never touch this.
# =============================================================================
%test.quarkus.mongodb.devservices.enabled=false
%test.quarkus.mongodb.connection-string=mongodb://localhost:27017
#  A DIFFERENT database from dev, deliberately. ApplicationBootTest is a
#  @QuarkusTest with no profile, so it wires the real Mongo client. While nothing
#  was listening on 27017 that was harmless — the driver connects lazily and the
#  test only asserts CDI wiring. Once a local mongod exists for dev, the same
#  test quietly holds a live handle to the demo data, and any future test that
#  touched a repository would read and write it without failing. Naming a
#  separate database makes that impossible rather than merely unlikely.
%test.quarkus.mongodb.database=form_poc_test
%test.form-poc.seed.enabled=false
%test.quarkus.log.category."com.certifyos.forms".level=WARN
